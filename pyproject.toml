[project]
name = "access-log-py"
version = "0.1.0"
description = "JSON access log middleware for Flask, shaped to mirror the BasharSoft nginx access log schema."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "BasharSoft" }]
keywords = ["flask", "logging", "access-log", "json", "observability"]
classifiers = [
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Logging",
]
dependencies = ["flask>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/access_log_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
